<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Modern Marketing</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">BrandName</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="pricing.html">Pricing</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h1>Get In Touch</h1>
        <p style="margin-bottom: 1.5rem;">Fill out the form below and our team will get back to you within 24 hours.</p>

        <form action="#" method="post">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn" style="border: none; cursor: pointer;">Send Message</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 BrandName. All rights reserved.</p>
    </footer>
</body>

</html>
